# Default pipeline configuration. Everything that changes a result belongs here, so that the
# config hash in the run manifest identifies it. Values marked TODO are decided when the matching item in TODO.md is done.

seed: 0

capture:
  target_fps: 3                # frame sampling rate: one frame, the sharpest, per 1/target_fps window; 3 is the rate of the reconstruction evidence (D-016, D-035)
  quality:                     # P1.4 capture gate. All guesses tuned on dev videos; see docs/stages.md
    blur_relative_floor: 0.3        # a frame is blurred below this fraction of the video's sharp level
    blur_reference_percentile: 90   # the sharp level: this percentile of per-window sharpness
    min_median_sharpness: 50        # Laplacian variance at 960 px; below it the whole video is soft
    max_blurred_fraction: 0.7       # reject when more windows than this are blurred
    min_median_brightness: 35       # grey level 0..255 per frame
    max_median_brightness: 245      # s11 alt_lighting reaches 244 and reconstructs fine; synthetic overexposed is 251
    max_bad_exposure_fraction: 0.25
    min_marker_fraction: 0.2        # capture protocol says visible in "most" of the video
    min_usable_frames: 20
  marker:
    family: aruco_4x4_50       # ArUco DICT_4X4_50, ids 0 to 5, see benchmark/make_board.py
    tag_size_m: 0.1003         # printed tag edge, mean of 5 caliper readings (100.1 to 100.4 mm, mean 100.26, s.e. 0.06)

reconstruction:
  quality:                     # P1.4; registered fraction and reprojection gates are in targets.yaml
    min_azimuth_coverage_deg: 40
  backend: pycolmap            # CPU SfM, decision D-016; VGGT and CUDA build deferred past the MVP
  sfm:                         # TODO.md item 6b; sequential matching is 2 to 4x faster than exhaustive on long videos
    matcher: sequential        # exhaustive or sequential; frames must be in video order
    sequential_overlap: 10
    loop_stride: 0             # sequential only: also match every n-th frame with all others
    mapper: incremental        # incremental or global
    max_image_size: -1         # -1 keeps pycolmap's default, an effective 3200 px, so 1080p frames are used whole, as in the SfM evidence (D-038)
    max_num_features: 8192
    ba_global_frames_ratio: 1.1
    ba_local_max_iterations: -1
    ba_global_max_iterations: -1
    num_threads: -1
  world_frame:
    plane_inlier_threshold_m: 0.004   # TODO(P1.6): tune on dev scenes; a guess, not yet measured
    plane_ransac_iterations: 500      # TODO(P1.6): tune on dev scenes
    plane_radius_m: 1.0               # TODO(P1.6): points this close to the reference tag fit the table; a guess
    tags_on_table:                    # optional layer: the tags lie on the table, so a plane away from them is wrong (s05: plane through the object tops, 3 to 7 cm up). A refit that cannot hold all tags is dropped and flagged (s24). Disable for scenes whose markers are not on the table plane
      enabled: true
      max_distance_m: 0.015           # farthest tag corner from the plane before a refit; dev scenes: good ones up to 8.2 mm, s05 64 mm
      refit_band_m: 0.02              # refit uses points this close to the plane through the tag corners; a guess
    max_tag_reprojection_px: 3.0      # TODO(P1.6): per-view limit when triangulating tag corners; a guess
    max_tag_scale_spread: 0.03        # TODO(P1.6): tag-to-tag scale disagreement that is flagged; a guess
    max_tag_fit_rms_m: 0.005          # TODO(P1.6): grid-board fit residual, benchmark check only

vlm:                           # the model behind the router, the material pass and vlm_mass; see docs/model_interfaces.md
  protocol: openai_chat        # openai_chat, anthropic_messages or python:package.module:factory
  base_url: https://inference.baseten.co/v1   # "/chat/completions" (openai_chat) or "/v1/messages" is appended
  model: meta-models/muse-spark-open-1026
  api_key_env: BASETEN_API_KEY # name of an environment variable or .env entry; null sends no Authorization header
  max_tokens: null             # caps thinking plus answer; a local reasoning model needs ~4096
  temperature: 0               # null leaves it to the server
  extra_body: {}               # merged into every request body, for provider options
  extra_headers: {}
  roles: {}                    # per-role overrides of any field above, under router, material, mass or verify

segmentation:
  sam_backend: null            # "api" or "self_hosted", see decision D-004 in docs/decisions.md
  router:                      # P2.1/P2.2: one VLM request per scene picks the SAM prompt and lists the objects
    n_frames: 3                # frames sent, spread evenly over the registered frames
    max_objects: 30            # longer lists are cut
    min_confidence: 0.5        # a lower surface confidence falls back to default_surface
    noun_prompt_max_objects: 1 # off the default surface, a scene with this many listed objects is tracked by its noun; 0 disables
    default_surface: table     # used when the call fails or the answer cannot be read
    timeout_s: 300
    retries: 3
    merge_synonyms: true         # one text-only call merges noun synonyms across views (9.4)
    noun_denylist: [table, board, marker, sheet, shadow, hand, arm, tablecloth, table cloth, cloth, mat,
                    piece of tape, strip of tape, tape strip, piece of masking tape]  # never SAM prompts (9.4); exact whole-noun match, so bare "tape" (a roll) and "tape roll" stay allowed
    views:                       # S12.9: router view selection; mode even keeps n_frames above
      mode: even                 # even or coverage (set cover over the workspace, 9.3)
      count: 6                   # views picked in coverage mode
      max_workers: 4             # parallel per-view calls, same pattern as material_pass
      cell_m: 0.02               # workspace grid step; guesses until tuned on dev (S12.9)
      probe_heights_m: [0.03, 0.10]  # a cell must be seen at both heights above the plane
      min_views_per_cell: 2      # views that must see a cell unoccluded
      workspace_margin_m: 0.10   # grid extends this far past the cloud footprint
      max_image_px: 1024         # router images are downscaled to this long side (9.4)
      table_margin_m: 0.003      # points below this above the plane are the table (as in lift)
      max_height_m: 0.35         # points above this are not workspace (as in lift)
    pool:                      # surface key -> description shown to the model, SAM concept prompt
      table:
        description: a table, desk or board
        prompt: objects on a table
      surface:
        description: a glossy or reflective surface that mirrors its surroundings, such as a glass stove top, polished counter or mirror; a matte counter, floor or shelf is not this
        prompt: object on a surface
      stack:
        description: objects stacked directly on top of each other in a pile or tower; choose this whenever one object rests on another, even on a table
        prompt: object on a table
  tracking:                    # P2.2: one SAM 3.1 video request per scene
    endpoint:                  # where the request goes; see docs/model_interfaces.md
      protocol: meta_responses # meta_responses (the Meta Model API, or a server imitating it) or python:package.module:factory
      url: https://api.meta.ai/v1/responses
      model: sam-3.1
      api_key_env: META_MODEL_API_KEY   # null sends no Authorization header
    prompt: objects on a table # the SAM 3.1 concept prompt when the router keeps the default surface; the video API takes one concept
    fps: 5                     # frame rate of the clip sent; billed per frame, at least 50 (dev.meta.ai pricing)
    direction: both            # propagation_direction: "both", "forward" or "backward"
    timeout_s: 600             # a long clip can take minutes to answer
    marker_filter:             # drops tracks that sit on an ArUco tag OpenCV decoded in that frame (a covered tag would not decode), stages/marker_filter.py
      enabled: true
      erode_px: 2              # detected tag quads shrink by this much, so mask bleed at the edge does not count
      min_mask_share: 0.2      # a frame is a hit when this share of the mask lies in the tags ...
      min_tag_share: 0.2       # ... or this share of the tags lies in the mask
      min_hit_frames: 2        # a track is dropped with at least this many hit frames ...
      min_hit_fraction: 0.2    # ... and this share of its frames where a tag was detected
    gap_fill:                  # S12.9: residual clusters -> VLM check -> one box request; guesses until tuned on dev
      enabled: false           # off until the 9.8 dev evaluation decides defaults (9.9); off keeps the stage byte-identical
      max_rounds: 1            # rounds per scene; only 1 is implemented
      max_noun_requests: 6     # noun fallback requests, one per failed accepted cluster
      max_video_requests: 8    # hosted video requests per scene, generic one included
      max_workers: 4           # gap-fill video requests in flight at once; the result does not depend on it
      save_video: true         # every track over every frame, as tracks_preview.mp4 in the stage folder
      cluster:                 # residual point clusters (step 3)
        radius_m: 0.03         # connected-component link distance
        min_points: 12         # smaller groups are noise
      cluster_check:           # per-cluster VLM check (steps 1-7); every value a guess until tuned on dev
        explain_ratio: 0.5     # tau_explain: best per-point vote at or above this explains a point
        accept_ratio: 0.5      # tau_accept: median cluster vote a box track must clear
        table_region:          # connected near-plane piece containing the world origin (step 2)
          cell_m: 0.05         # grid cell of the table-region flood fill
          dilate_m: 0.10       # the table region grows by this much
        board_margin_m: 0.02   # the triangulated board footprint grows by this much
        views_per_cluster: 2   # cropped views sent to the VLM per cluster
        min_azimuth_gap_deg: 25.0  # prompt views must be this far apart around the cluster
        box_pad_px: 8          # pad around the projected cluster box
        crop:                  # the VLM crop of one cluster view (step 4)
          margin_frac: 0.5     # crop margin, times the box's long side
          min_margin_px: 16    # ... and at least this many pixels
          max_px: 512          # crops are resized to at most this long side
          dim: 0.35            # kept-mask pixels are multiplied by this in the crop
        min_confidence: 0.7    # the VLM verdict must clear this to accept a cluster; 0.68 accepted the s24 match bundle in the 9.8 subset
        max_workers: 4         # cluster checks in flight at once; the result does not depend on it
      merge_iou: 0.5           # median mask IoU that makes a new track a duplicate
      merge_new_iou: 0.35      # lower bar when the other track is gap-fill new too: two prompts of one object draw different extents; a guess until tuned on dev
      part_inclusion: 0.9      # containment that makes a new track a part
    repair:                    # 3D identity repair; thresholds are guesses until tuned on dev scenes
      merge_radius_m: 0.05     # tracks with no shared frame whose table footprints are this close are one object
      merge_boundary_gap: 2    # ... or whose closest frames are this far apart with masks overlapping past merge_boundary_iou (a handoff: the id switched away and back)
      merge_boundary_iou: 0.5  # handoff mask overlap; disjoint raw s12_b track pairs all score 0.0, a true handoff near 1.0
      split_gap_m: 0.10        # a track whose footprints fall into groups this far apart is two objects
      min_frames: 3            # smallest group that counts as an object when splitting
      sliver_frac: 0.2         # feet from masks below this share of the track median are occlusion slivers, not new objects
  verify:                      # end-of-segmentation coverage check: VLM look plus noun prompts, looped
    enabled: false             # off until it is evaluated (TODO.md item 9); turn it on per run to try it. Off keeps the stage byte-identical
    max_turns: 3               # verification rounds at most; -1 loops until a round prompts nothing new
    max_noun_requests: 4       # targeted SAM video requests per round at most
    views: 3                   # whole-scene frames with kept-track outlines sent to the VLM
    max_image_px: 1024         # overlays are downscaled to this long side
    min_confidence: 0.5        # below this the VLM answer verifies nothing
    timeout_s: 300             # the VLM call budget, like the router's
    retries: 3
  lift:                        # P2.3: masks to point clusters by voting over views (visual hull)
    voxel_m: 0.005             # grid resolution; a cluster point is a voxel centre
    max_height_m: 0.35         # first-pass grid top; tracks reaching it are re-voted on the tall grid
    tall_height_m: 1.0         # second-pass grid top, paid only when a track reaches the first pass;
                               # walls (room height) still run through it and are dropped by the cap test
    cap_top_m: 0.02            # top band whose occupancy must fall off for a capped column; guesses
    cap_frac: 0.5              # at most this share of the peak layer occupancy in that band; a guess
    edge_frac: 0.05            # lateral-edge voxels at or above this share of the component fail it; a guess (s25 vase: 0.7% incidental contact)
    margin_m: 0.10             # grid extends this far beyond the track footprints
    max_extent_m: 2            # refuse a grid wider than this (a stray track far from the others)
    max_views: 40              # frames used, spread evenly; cost is voxels x views x tracks
    mask_downscale: 2          # masks are shrunk by this factor before lookup
    min_views: 5               # a voxel needs this many views that see it
    min_agreement: 0.9         # share of those views whose mask must contain it; the slack is occlusion
    min_voxels: 20             # smaller clusters are dropped and listed in the lift report
    occlusion_aware: true      # excuse views where a voxel lands on another track's mask only
    small_mask_px: 15000       # tracks below this median mask size vote with the small thresholds
    small_min_agreement: 0.9   # agreement for small tracks
    small_min_voxels: 20       # minimum voxels for small tracks
    dup_dist_m: 0.02           # clusters closer than this are one object; the smaller is dropped as a duplicate
    min_points: 8              # the sparse-point variant: fewer voted SfM points drop the track
    table_margin_m: 0.003      # sparse points this close to the table plane are the table, not the object
    trim_points_per_side: 2    # outermost sparse points dropped per side of the resting box (strays); easy-tier median 18.7% -> 8.9%, docs/research/cluster_box_accuracy.md
  primitive_fit:               # box, cylinder or sphere fitted to the masks from the trimmed points; see stages/primitive_fit.py
    mask_downscale: 4          # masks are shrunk by this factor before the outline is compared
    min_views: 5               # fewer whole (not edge-cut) masks and the points stay the cluster
    min_mask_px: 20            # smaller masks (after downscaling) are skipped
    iterations: 300            # random-walk steps per kind
    shrink_every: 100          # the step shrinks after this many steps ...
    shrink: 0.6                # ... by this factor
    step_m: 0.005              # starting step of centre and sizes
    step_deg: 5.0              # starting step of the yaw
    min_size_m: 0.005          # a primitive side below this is rejected
    stack_min_overlap: 0.8     # stacked: this share of the footprint lies over another object ...
    duplicate_dist_m: 0.02     # fitted primitives this close, this similar in size, with no
    duplicate_z_overlap: 0.5   # with a shared frame, still a duplicate when the z-ranges overlap this much of the shorter one (a stack's upper cluster is seated above the lower)
    duplicate_size_frac: 0.15  # shared frame are one fragmented track; the smaller is dropped
                             # (s12 video_b breakfast tracks agree to 5 mm and 1%; the closest
                             # distinct pair, s13 stacked boxes, differs by 48% in size)
    stack_gap_m: 0.02          # ... and the lowest points are this close to that object's top; s13 is 1.0 cm off
    stack_min_points: 20       # fewer points say nothing about where an object starts
    stack_percentile: 2.0      # the lowest points, without strays
    max_cost: 0.10             # above this mask disagreement the cluster is the union of primitive and points; chosen on the dev scenes (cluster_box_accuracy.md)
    seed: 0
  keyframes_per_object: 5
  keyframes:                   # P2.4; per-frame quality is the product of four scores, see stages/keyframes.py
    min_mask_px: 400           # smaller masks are not candidates
    border_band_frac: 0.02     # band at the image edge, share of the short side; mask pixels in it count as cut off
    occluder_ring_px: 6        # ring around the mask checked for other tracks' masks
    weight_area: 1.0           # exponent of each score; 0 switches it off
    weight_border: 1.0
    weight_occlusion: 1.0
    weight_sharpness: 0.5
    diversity_weight: 0.8      # a frame at the same viewing angle as a chosen one keeps 1 - this of its quality
    diversity_sigma_deg: 25.0  # viewing angle at which the penalty falls to 61%
    min_quality: 0.15          # a frame whose own quality is lower is never chosen, so fewer than the count may result
    min_separation_deg: 5.0    # a frame this close in viewing angle to a chosen one adds nothing and is skipped
  depth_flags:                 # P2.5 geometry evidence; guesses fitted on 5 reflective objects of s17 and s18, see stages/depth_flags.py
    min_points: 100            # fewer voted SfM points than this and geometry cannot decide
    flag_err_ratio: 2.0        # flag when point error is this many times the table's ...
    flag_short_frac: 0.45      # ... and at least this share of its points is short-lived
    clear_err_ratio: 1.7       # clear only when point error is at most this (the spray can, a true positive, sits at 1.80) ...
    clear_short_frac: 0.35     # ... short-lived share at most this ...
    clear_hull_iou: 0.8        # ... hull and mask overlap at least this ...
    clear_outside_hull_frac: 0.05  # ... and at most this share of points lies away from the hull
  shape_flags:                 # P2.5 geometric flags from the visual hull and the masks; thresholds are provisional, see stages/shape_flags.py
    small_max_extent_m: 0.06   # SMALL when the largest hull extent is at most this (hulls read 1.3 to 2 times a 30 mm object)
    thin_max_extent_m: 0.035   # THIN when the smallest hull extent is at most this ...
    thin_max_ratio: 0.3        # ... and at most this share of the largest
    occluded_frame_frac: 0.25  # a frame is occluded when this share of the mask outline lies on other tracks
    occluded_share: 0.5        # OCCLUDED when this share of the track's frames are occluded
    min_frames: 5              # fewer usable frames and occlusion is not judged
  material_pass:               # P2.5 flag and the classification half of P4.4, pulled forward (D-017); one hosted call per object
    keyframes: 2               # best keyframes of the object sent in one request
    crop_pad_px: 40            # margin around the mask in each crop
    min_confidence: 0.6        # an answer below this is not trusted and the object stays flagged
    max_workers: 4             # parallel hosted requests; they are independent and cached by key
    timeout_s: 120             # per attempt
    retries: 4                 # attempts on HTTP 429 and 5xx, with 2, 4, 8 s waits between them
    finishes: [matte, glossy, metallic, mirror, transparent, translucent]
    reflective_finishes: [metallic, mirror, transparent, translucent]   # flag the object when the model names one of these
    classes:                   # final list (P4.3); the numbers are in configs/material_table.yaml
      - cardboard
      - paper
      - plastic_hard
      - rubber
      - foam
      - ceramic
      - glass
      - metal_steel
      - metal_aluminium
      - foil_wrapped_food
      - textile
      - wood
      - electronics_mixed
      - other

shape:
  backend: sam3d               # chosen in the P3.3 bake-off (D-018); or python:package.module:factory, see docs/model_interfaces.md
  transport: modal             # how sam3d reaches its GPU: modal, http or python:package.module:factory
  modal:                       # transport modal: the deployment of models/sam3d_modal.py
    app: video2sim-sam3d
    cls: Sam3dWorker
  http:                        # transport http: a server with the wire format of models/sam3d_http.py
    url: null                  # for example http://localhost:8000
    api_key_env: null          # name of an environment variable or .env entry; null sends no Authorization header
    timeout_s: 600
    retries: 3
  keyframes_per_object: 6      # P3.4: best keyframes the model is run on
  samples_per_keyframe: 1      # seeds per keyframe; one draw on each of up to keyframes_per_object keyframes (D-033 dropped D-030's 2 draws; a dev replay gave 5.7% size error with 2 against 5.0% with 6)
  max_views: 12                # frames whose masks enter registration, spread over the video
  min_fit_score: 0.5           # below this the convex hull of the cluster stands in; a guess
  support_gap_m: 0.01          # a cluster this close to the table rests on it (P3.5)
  sam3d:                       # P3.1, models/sam3d.py
    checkpoint: facebook/sam-3d-objects   # Hugging Face repo; the host reports the revision
    stage1_inference_steps: null   # null keeps SAM 3D's own default
    stage2_inference_steps: null
    # Off until the P3.3 A/B: the paper reports shape barely depends on it, and P3.2 sets
    # pose and scale from the metric cloud (docs/research/sam3d.md, section 5)
    use_pointmap: false
    warm_containers: 4         # started when segmentation starts; 0 is off (D-032, D-034: one per container)
    warm_hold_s: 30            # each stays busy this long, or both calls land on one container
  parallel_samples: 6          # hosted draws in flight at once; the result does not depend on it
  parallel_registrations: 3    # meshes registered at once; the result does not depend on it
  stretch_samples: 1           # best samples per object that get the per-axis refinement
  early_stop:                  # N10, D-040: draw min_draws per object first, the rest only when those disagree
    enabled: true              # off until a dev replay of cached draws weighs size error against draws saved
    min_draws: 2               # first draws, in draw order (best keyframes first)
    size_tolerance: 0.1        # they agree when every resting-box side differs by at most this share and each fits >= min_fit_score
  registration:                # P3.2, stages/registration.py; first guesses, tune in P3.3
    surface_samples: 3000      # mesh points for the point term
    mask_samples: 400          # mesh points projected into each view
    mask_directions: 8         # image directions where mesh and mask must reach equally far
    max_vertices: 4000         # mesh vertices projected for that reach
    max_target_points: 2000    # observed points kept, chosen at random by the seed
    sigma_points_m: 0.003
    sigma_mask_px: 3.0
    mask_weight: 1.0           # lambda in the registration cost (docs/stages.md)
    huber_m: 0.005             # above this a point counts linearly, for SfM strays
    inlier_m: 0.010            # fit score: observed points this close to the mesh; 5 mm is
                         # tighter than generative accuracy (D-030: 5 to 6% size error), which sent
                         # the good s15 video_b basket (best fit 0.17) to a proxy hull; 10 mm takes
                         # it to 0.75. A guess: validate proxy rate and size error on dev.
    yaw_hypotheses: 4          # starts at quarter turns about world up
    yaw_screen_iterations: 4   # rounds each start gets before the best one is refined
    outer_iterations: 50       # nearest-neighbour rounds; about 20 on the synthetic box
    inner_iterations: 5        # Levenberg-Marquardt steps per round
    upright_sigma_deg: 1.0     # tilt of the levelled model axis; 0 turns the term off
    contact_sigma_m: 0.002     # lowest vertex against the support height, when one is given
    stretch_sigma: 0.5         # log scale per model axis after the similarity fit; 0 is off

physics:
  material_table: configs/material_table.yaml
  max_convex_parts: 16
  parallel_mass_calls: 6       # hosted mass requests in flight at once
  parallel_objects: 2          # objects repaired and decomposed at once; low because CoACD is CPU heavy and three COLMAP runs at once crashed the Mac
  collision:                   # P4.2, stages/collision.py
    primitive_tolerance: 0.04       # a primitive is used if its surface is within this share of the bbox diagonal (95th percentile)
    primitive_volume_ratio: [0.8, 1.25]   # and its volume is this close to the mesh's
    fit_tolerance: 0.05             # collision_fit: parts' surfaces within this share of the bbox diagonal of the visual surface (95th percentile)
    fit_min_coverage: 0.95          # and at least this share of the visual surface inside or near a part
    fit_cover_tolerance: 0.01       # near, as a share of the bbox diagonal
    max_part_vertices: 255          # per convex part; assumed PhysX limit, verify in P5.1
    coacd_threshold: 0.05           # CoACD concavity threshold
    coacd_resolution: 2000          # CoACD search resolution; 500 barely moves wall time on s02 obj_001, so this stays
    coacd_mcts_iterations: 30       # CoACD search iterations per cut; 30 keeps the s02/s12 part counts with all fit checks passing, ~2x faster than 150
    decomp_decimate: true           # decompose a decimated copy; the checks still run against the full mesh
    decomp_max_faces: 12000         # a decomposition input above this many faces is decimated to it
    decomp_volume_change_frac: 0.05 # a decimated copy that moves the volume more than this is dropped
    adaptive_escalation: true       # try hull, then a cheap decomposition, then the full one; each rung must pass the checks
    cheap_threshold: 0.25           # concavity threshold of the cheap rung; coarser than coacd_threshold
    cheap_max_parts: 4              # part cap of the cheap rung
    decomp_cache: true              # reuse decompositions by input hash under physics.work/decomp_cache
    seed: 0
  mass:                        # P4.5, stages/mass.py; values from docs/research/mesh_volume.md
    seal_radius: 0.04               # gaps up to this share of the longest side are closed; 2% misses cracks, 8% closes a bottle neck
    open_vessel_hull_ratio: 0.5     # a sealed body under this share of its hull has an open cavity, so no hollow correction
    grid: 128                       # voxels along the longest side
    samples_per_voxel_area: 8.0     # surface samples per voxel face area
    max_surface_samples: 3000000
    seed: 0
  vlm_mass:                    # D-024, stages/vlm_mass.py; one hosted call per object
    enabled: true              # false makes no call and needs no key: geometry mass only, 36% within 30% held out against 52%
    keyframes: 2               # as segmentation.material_pass
    crop_pad_px: 40
    timeout_s: 120
    retries: 4
  settling:                    # P4.7, stages/settling.py; window and drift limit are in targets.yaml
    round_tolerance: 0.04           # within this share of the bbox diagonal of an ellipsoid an object cannot be expected to rest (D-025); dev: egg 0.028, nearest other 0.053
    timestep_s: 0.001               # stable on the closed-form tests in tests/test_settling.py
    gravity_m_s2: 9.80665           # standard gravity, CGPM 1901
    penetration_tolerance_m: 0.0005 # overlaps deeper than this are separated before the drop
    max_separation_iterations: 200
    noslip_iterations: 5            # removes the creep of soft friction on a slope
    drift_sample_s: 0.02            # how often drift is read during the window
  repair:                      # P4.1, stages/mesh_repair.py
    min_component_area_frac: 0.02   # a piece smaller than this share of the largest piece's area is a floater
    min_volume_m3: 1.0e-9           # below this the mesh is not a solid
    max_triangles: 60000            # triangle budget per visual mesh; above it the mesh is decimated
    max_volume_change_frac: 0.02    # decimation that moves the volume more than this is rejected
    decimation_aggression: 5        # fast_simplification agg, 3 to 10; below 3 it stops short of the budget

export:
  simulator: mujoco            # validation and demo simulator in Phase 5 (D-027)
  table_size_m: 2.0            # shown width of the table plane; its collision is infinite
  qa_views: 3                  # camera views in the QA report, evenly spaced over the frames
  check_tolerance: 1.0e-4      # share of the value allowed in USD and URDF read-back checks
  check_tolerance_m: 1.0e-4    # same, for positions and mesh bounds

demo:                          # P5.4, src/video2sim/pick_place.py
  panda_model: data/third_party/mujoco_menagerie/franka_emika_panda/panda.xml  # scripts/fetch_panda.sh
  base_distance_m: 0.45        # arm base from the object, well inside the Panda's 0.855 m reach
  place_distance_m: 0.15       # goal from where the object starts
  grasp_depth_m: 0.02          # pad center below the object's top
  min_grasp_height_m: 0.02     # pad center above the table, so the fingertips clear it
  grip_force_n: 70.0           # continuous grasp force of the Franka Hand, from reseller specification listings; Franka's own hand datasheet not found
  lift_clearance_m: 0.03       # commanded above the required lift, for sag and slip
  max_width_m: 0.07            # the gripper opens 0.08 m; leaves 5 mm a side
  min_height_m: 0.03           # lower objects leave no room for the pads
  min_clearance_m: 0.03        # free space around the object, footprint to footprint
  base_angles: 16              # directions tried for the arm base
  control_dt_s: 0.01
  video_fps: 30
  video_size_px: [640, 480]

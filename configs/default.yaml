# Default pipeline configuration. Everything that changes a result belongs here, so that the
# config hash in the run manifest identifies it. Values marked TODO are decided in a PLAN.md phase.

seed: 0

capture:
  target_fps: 5                # frame sampling rate: one frame, the sharpest, per 1/target_fps window
  quality:                     # P1.4 capture gate. All guesses tuned on dev videos; see PLAN.md
    blur_relative_floor: 0.3        # a frame is blurred below this fraction of the video's sharp level
    blur_reference_percentile: 90   # the sharp level: this percentile of per-window sharpness
    min_median_sharpness: 50        # Laplacian variance at 960 px; below it the whole video is soft
    max_blurred_fraction: 0.3       # reject when more windows than this are blurred
    min_median_brightness: 35       # grey level 0..255 per frame
    max_median_brightness: 245      # s11 alt_lighting reaches 244 and reconstructs fine; synthetic overexposed is 251
    max_bad_exposure_fraction: 0.25
    min_marker_fraction: 0.5        # capture protocol says visible in "most" of the video
    min_usable_frames: 20
  marker:
    family: aruco_4x4_50       # ArUco DICT_4X4_50, ids 0 to 5, see benchmark/make_board.py
    tag_size_m: 0.1003         # printed tag edge, mean of 5 caliper readings (100.1 to 100.4 mm, mean 100.26, s.e. 0.06)

reconstruction:
  quality:                     # P1.4; registered fraction and reprojection gates are in targets.yaml
    min_azimuth_coverage_deg: 60    # TODO(P1.6): guess from the capture protocol's "three different directions"; tune in Phase 3
  backend: pycolmap            # CPU SfM, decision D-016; VGGT and CUDA build deferred past the MVP
  sfm:                         # PLAN.md item 6b; sequential matching is 2 to 4x faster than exhaustive on long videos
    matcher: sequential        # exhaustive or sequential; frames must be in video order
    sequential_overlap: 10
    loop_stride: 0             # sequential only: also match every n-th frame with all others
    mapper: incremental        # incremental or global
    max_image_size: -1         # -1 keeps pycolmap's default
    max_num_features: 8192
    ba_global_frames_ratio: 1.1
    ba_local_max_iterations: -1
    ba_global_max_iterations: -1
    num_threads: -1
  world_frame:
    plane_inlier_threshold_m: 0.004   # TODO(P1.6): tune on dev scenes; a guess, not yet measured
    plane_ransac_iterations: 500      # TODO(P1.6): tune on dev scenes
    plane_radius_m: 1.0               # TODO(P1.6): points this close to the reference tag fit the table; a guess
    max_tag_reprojection_px: 3.0      # TODO(P1.6): per-view limit when triangulating tag corners; a guess
    max_tag_scale_spread: 0.03        # TODO(P1.6): tag-to-tag scale disagreement that is flagged; a guess
    max_tag_fit_rms_m: 0.005          # TODO(P1.6): grid-board fit residual, benchmark check only

segmentation:
  sam_backend: null            # "api" or "self_hosted", see PLAN.md decision D-004
  router:                      # P2.1/P2.2: one VLM request per scene picks the SAM prompt and lists the objects
    n_frames: 3                # frames sent, spread evenly over the registered frames
    max_objects: 30            # longer lists are cut
    min_confidence: 0.5        # a lower surface confidence falls back to default_surface
    noun_prompt_max_objects: 1 # off the default surface, a scene with this many listed objects is tracked by its noun; 0 disables
    default_surface: table     # used when the call fails or the answer cannot be read
    timeout_s: 300
    retries: 3
    pool:                      # surface key -> description shown to the model, SAM concept prompt
      table:
        description: a table, desk or board
        prompt: objects on a table
      surface:
        description: a glossy or reflective surface that mirrors its surroundings, such as a glass stove top, polished counter or mirror; a matte counter, floor or shelf is not this
        prompt: object on a surface
  tracking:                    # P2.2: one SAM 3.1 video request per scene
    prompt: objects on a table # the SAM 3.1 concept prompt when the router keeps the default surface; the video API takes one concept
    fps: 5                     # frame rate of the clip sent; billed per frame, at least 50 (dev.meta.ai pricing)
    direction: both            # propagation_direction: "both", "forward" or "backward"
    timeout_s: 600             # a long clip can take minutes to answer
    repair:                    # 3D identity repair; thresholds are guesses until tuned on dev scenes
      merge_radius_m: 0.05     # tracks with no shared frame whose table footprints are this close are one object
      split_gap_m: 0.10        # a track whose footprints fall into groups this far apart is two objects
      min_frames: 3            # smallest group that counts as an object when splitting
  lift:                        # P2.3: masks to point clusters by voting over views (visual hull)
    voxel_m: 0.005             # grid resolution; a cluster point is a voxel centre
    max_height_m: 0.35         # grid top above the table plane; objects taller than this are cut off
    margin_m: 0.10             # grid extends this far beyond the track footprints
    max_extent_m: 2.0          # refuse a grid wider than this (a stray track far from the others); s05 is 1.52 m with no stray
    max_views: 40              # frames used, spread evenly; cost is voxels x views x tracks
    mask_downscale: 2          # masks are shrunk by this factor before lookup
    min_views: 5               # a voxel needs this many views that see it
    min_agreement: 0.9         # share of those views whose mask must contain it; the slack is occlusion
    min_voxels: 20             # smaller clusters are dropped and listed in the lift report
    min_points: 8              # the sparse-point variant: fewer voted SfM points drop the track
    table_margin_m: 0.003      # sparse points this close to the table plane are the table, not the object
    trim_points_per_side: 2    # outermost sparse points dropped per side of the resting box (strays); easy-tier median 18.7% -> 8.9%, docs/research/cluster_box_accuracy.md
  primitive_fit:               # box, cylinder or sphere fitted to the masks from the trimmed points; see stages/primitive_fit.py
    mask_downscale: 4          # masks are shrunk by this factor before the outline is compared
    min_views: 5               # fewer whole (not edge-cut) masks and the points stay the cluster
    min_mask_px: 20            # smaller masks (after downscaling) are skipped
    iterations: 300            # random-walk steps per kind
    shrink_every: 100          # the step shrinks after this many steps ...
    shrink: 0.6                # ... by this factor
    step_m: 0.005              # starting step of centre and sizes
    step_deg: 5.0              # starting step of the yaw
    min_size_m: 0.005          # a primitive side below this is rejected
    max_cost: 0.10             # above this mask disagreement the cluster is the union of primitive and points; chosen on the dev scenes (cluster_box_accuracy.md)
    seed: 0
  keyframes_per_object: 5
  keyframes:                   # P2.4; per-frame quality is the product of four scores, see stages/keyframes.py
    min_mask_px: 400           # smaller masks are not candidates
    border_band_frac: 0.02     # band at the image edge, share of the short side; mask pixels in it count as cut off
    occluder_ring_px: 6        # ring around the mask checked for other tracks' masks
    weight_area: 1.0           # exponent of each score; 0 switches it off
    weight_border: 1.0
    weight_occlusion: 1.0
    weight_sharpness: 0.5
    diversity_weight: 0.8      # a frame at the same viewing angle as a chosen one keeps 1 - this of its quality
    diversity_sigma_deg: 25.0  # viewing angle at which the penalty falls to 61%
    min_quality: 0.15          # a frame whose own quality is lower is never chosen, so fewer than the count may result
    min_separation_deg: 5.0    # a frame this close in viewing angle to a chosen one adds nothing and is skipped
  depth_flags:                 # P2.5 geometry evidence; guesses fitted on 5 reflective objects of s17 and s18, see stages/depth_flags.py
    min_points: 100            # fewer voted SfM points than this and geometry cannot decide
    flag_err_ratio: 2.0        # flag when point error is this many times the table's ...
    flag_short_frac: 0.45      # ... and at least this share of its points is short-lived
    clear_err_ratio: 1.7       # clear only when point error is at most this (the spray can, a true positive, sits at 1.80) ...
    clear_short_frac: 0.35     # ... short-lived share at most this ...
    clear_hull_iou: 0.8        # ... hull and mask overlap at least this ...
    clear_outside_hull_frac: 0.05  # ... and at most this share of points lies away from the hull
  shape_flags:                 # P2.5 geometric flags from the visual hull and the masks; thresholds are provisional, see stages/shape_flags.py
    small_max_extent_m: 0.06   # SMALL when the largest hull extent is at most this (hulls read 1.3 to 2 times a 30 mm object)
    thin_max_extent_m: 0.035   # THIN when the smallest hull extent is at most this ...
    thin_max_ratio: 0.3        # ... and at most this share of the largest
    occluded_frame_frac: 0.25  # a frame is occluded when this share of the mask outline lies on other tracks
    occluded_share: 0.5        # OCCLUDED when this share of the track's frames are occluded
    min_frames: 5              # fewer usable frames and occlusion is not judged
  material_pass:               # P2.5 flag and the classification half of P4.4, pulled forward (D-017); one hosted call per object
    keyframes: 2               # best keyframes of the object sent in one request
    crop_pad_px: 40            # margin around the mask in each crop
    min_confidence: 0.6        # an answer below this is not trusted and the object stays flagged
    max_workers: 4             # parallel hosted requests; they are independent and cached by key
    timeout_s: 120             # per attempt
    retries: 4                 # attempts on HTTP 429 and 5xx, with 2, 4, 8 s waits between them
    finishes: [matte, glossy, metallic, mirror, transparent, translucent]
    reflective_finishes: [metallic, mirror, transparent, translucent]   # flag the object when the model names one of these
    classes:                   # PROVISIONAL keys from the materials seen on the dev scenes; P4.3 owns the final list and the numbers
      - cardboard
      - paper
      - plastic_hard
      - rubber
      - foam
      - ceramic
      - glass
      - metal_steel
      - metal_aluminium
      - foil_wrapped_food
      - textile
      - wood
      - electronics_mixed
      - other

shape:
  backend: sam3d               # the only adapter; chosen in the P3.3 bake-off (D-018)
  keyframes_per_object: 2      # P3.4: best keyframes the model is run on
  samples_per_keyframe: 3      # seeds per keyframe
  max_views: 12                # frames whose masks enter registration, spread over the video
  min_fit_score: 0.5           # below this the convex hull of the cluster stands in; a guess
  support_gap_m: 0.01          # a cluster this close to the table rests on it (P3.5)
  sam3d:                       # P3.1, models/sam3d.py
    checkpoint: facebook/sam-3d-objects   # Hugging Face repo; the host reports the revision
    stage1_inference_steps: null   # null keeps SAM 3D's own default
    stage2_inference_steps: null
    # Off until the P3.3 A/B: the paper reports shape barely depends on it, and P3.2 sets
    # pose and scale from the metric cloud (docs/research/sam3d.md, section 5)
    use_pointmap: false
  parallel_samples: 6          # hosted draws in flight at once; the result does not depend on it
  stretch_samples: 1           # best samples per object that get the per-axis refinement
  registration:                # P3.2, stages/registration.py; first guesses, tune in P3.3
    surface_samples: 3000      # mesh points for the point term
    mask_samples: 400          # mesh points projected into each view
    mask_directions: 8         # image directions where mesh and mask must reach equally far
    max_vertices: 4000         # mesh vertices projected for that reach
    max_target_points: 2000    # observed points kept, chosen at random by the seed
    sigma_points_m: 0.003
    sigma_mask_px: 3.0
    mask_weight: 1.0           # lambda in the PLAN.md cost
    huber_m: 0.005             # above this a point counts linearly, for SfM strays
    inlier_m: 0.005            # fit score: observed points this close to the mesh
    yaw_hypotheses: 4          # starts at quarter turns about world up
    yaw_screen_iterations: 4   # rounds each start gets before the best one is refined
    outer_iterations: 50       # nearest-neighbour rounds; about 20 on the synthetic box
    inner_iterations: 5        # Levenberg-Marquardt steps per round
    upright_sigma_deg: 1.0     # tilt of the levelled model axis; 0 turns the term off
    contact_sigma_m: 0.002     # lowest vertex against the support height, when one is given
    stretch_sigma: 0.5         # log scale per model axis after the similarity fit; 0 is off

physics:
  material_table: configs/material_table.yaml
  max_convex_parts: 16
  collision:                   # P4.2, stages/collision.py
    primitive_tolerance: 0.04       # a primitive is used if its surface is within this share of the bbox diagonal (95th percentile)
    primitive_volume_ratio: [0.8, 1.25]   # and its volume is this close to the mesh's
    fit_tolerance: 0.05             # collision_fit: parts' surfaces within this share of the bbox diagonal of the visual surface (95th percentile)
    fit_min_coverage: 0.95          # and at least this share of the visual surface inside or near a part
    fit_cover_tolerance: 0.01       # near, as a share of the bbox diagonal
    max_part_vertices: 255          # per convex part; assumed PhysX limit, verify in P5.1
    coacd_threshold: 0.05           # CoACD concavity threshold
    seed: 0
  repair:                      # P4.1, stages/mesh_repair.py
    min_component_area_frac: 0.02   # a piece smaller than this share of the largest piece's area is a floater
    min_volume_m3: 1.0e-9           # below this the mesh is not a solid
    max_triangles: 20000            # triangle budget per visual mesh; above it the mesh is decimated
    max_volume_change_frac: 0.02    # decimation that moves the volume more than this is rejected
    decimation_aggression: 5        # fast_simplification agg, 3 to 10; below 3 it stops short of the budget

export:
  simulator: isaac_sim         # assumed, see PLAN.md decision D-001

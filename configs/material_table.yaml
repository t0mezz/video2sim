# Curated material properties. The material-inference model only ever picks a key from this
# table; code reads the numbers from here. The model never writes a number.
#
# Every value needs a source. Where none could be found the field is named in `unsourced` and
# its range is a deliberately wide educated placeholder, not a measurement. Friction and
# restitution placeholders are accepted as they are (D-019): the benchmark has no measurement
# that could narrow them. An unsourced density makes the object carry
# Flag.LOW_CONFIDENCE_MATERIAL downstream, and P4.6 narrows what the weighed objects support.
# Do not fill a value from memory without listing it in `unsourced`. The values and where each
# was found are in docs/research/material_sources.md (source files in docs/sources/, not in git).
#
# Schema of one entry:
#
#   ceramic:
#     density_kg_m3:        {low: ..., nominal: ..., high: ...}
#     friction_coefficient: {low: ..., nominal: ..., high: ...}   # against a typical table surface
#     restitution:          {low: ..., nominal: ..., high: ...}
#     sources: ["<source id>", ...]
#     unsourced: [density_kg_m3, friction_coefficient, restitution]   # the fields with no source
#     note: "..."
#
# Keys must equal segmentation.material_pass.classes in configs/default.yaml (a test checks it).

# Share of an object's sealed volume that holds material at the density below (P4.5, P4.6).
# Not a material property and not from a reference: the 10th, 50th and 90th percentile of weighed
# mass / (nominal density * sealed volume) on the dev objects, per solid-or-hollow answer
# (benchmark/results/p4_6_fill_fit.json, benchmark/fit_fill_fractions.py). A class has its own
# value under an entry only with 3 distinct objects behind it. Because it divides by nominal
# density it also absorbs density errors. An open vessel keeps 1 (stages/mass.py).
hollow_fill_fraction: {low: 0.039, nominal: 0.278, high: 0.681}
solid_fill_fraction:  {low: 0.317, nominal: 0.441, high: 1.0}

materials:

    hollow_fill_fraction: {low: 0.21, nominal: 0.248, high: 0.302}
    sources: [marks_10e_table_6.1.5]
    unsourced: [friction_coefficient, restitution]
    note: "Density is solid paper sheet; a box is thin-walled, so the hollow correction (P4.5) does the rest."
  paper:

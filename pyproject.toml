[project]
name = "video2sim"
version = "0.0.1"
description = "Convert a smartphone video of a tabletop workspace into a physics-ready USD/URDF scene."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=5.0.0.93",
    "pycolmap>=4.2.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "trimesh>=5.2.0",
]

[project.scripts]
video2sim = "video2sim.cli:main"

# Heavy, GPU-bound dependencies (torch, reconstruction, mesh and USD libraries)
# are added per phase, behind optional extras, so that the schema layer and the
# test suite install and run on any machine. See PLAN.md.

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video2sim"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gpu: needs a CUDA GPU (skipped on machines without one)",
    "slow: takes more than a few seconds",
    "network: calls an external API (needs keys, costs money)",
]
